name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Atlas to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds, other tools, other designs.
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options:
        - atlas.yaml / runtime
        - TUI
        - MCP / agents
        - Atlas Desktop
        - GPU terminal
        - atlas deploy
        - docs
        - other
    validations:
      required: true
