name: Apt packages
description: >-
  Installs apt packages on a Linux runner from a cache of the .deb files (keyed by runner image version, architecture
  and package list), and, when the cache is cold, from azure.archive.ubuntu.com and then the image's own sources, with a
  time limit on every call (scripts/ci-apt.sh, #604). Expects the repository checked out. A composite step cannot have `timeout-minutes`
  (actions/runner#1979): the caller puts one on the step that uses this action, and the script bounds each of its
  own steps.

inputs:
  packages:
    description: Space-separated package names.
    required: true

runs:
  using: composite
  steps:
    - name: Cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # ImageVersion changes with every runner image: the files cached are those the image of that version lacked.
        echo "key=apt-${ImageOS:-linux}-${ImageVersion:-none}-$(uname -m)-$(printf '%s' "$PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Restore the packages
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-debs
        key: ${{ steps.key.outputs.key }}

    - name: Install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        CACHE_DIR: ${{ runner.temp }}/apt-debs
      run: |
        read -ra pkgs <<<"$PACKAGES"
        "$GITHUB_WORKSPACE/scripts/ci-apt.sh" "$CACHE_DIR" "${pkgs[@]}"

    # Saved only from main and release branches (same rule as the cargo cache): root installs these files with dpkg
    # later, so a pull request never writes them.
    - name: Save the packages
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-debs
        key: ${{ steps.key.outputs.key }}
