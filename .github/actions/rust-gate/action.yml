name: Rust gate
description: >-
  The Rust half of `bun run check` (fmt, clippy, nextest, doctests), shared by the macOS and Linux CI jobs so
  they cannot drift apart. Expects the repository checked out.

inputs:
  tests:
    description: >-
      "true": the full gate. "false": the tree already passed CI in its pull request (scripts/ci-tested.sh), so
      only build what a pull request builds (clippy + test binaries) to keep the cache warm.
    default: "true"
  defer-tests:
    description: >-
      "true": skip the test and doctest steps here; the calling job runs them itself (a composite step cannot have
      `timeout-minutes`, so the Windows job runs them as its own steps with one, see ci.yml `rust-windows`).
    default: "false"

runs:
  using: composite
  steps:
    # rust-toolchain.toml pins the version; rustup installs it (with rustfmt + clippy) on first use.
    - name: Install Rust
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    - name: Install nextest
      if: ${{ runner.os != 'Windows' }}
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: nextest

    # On windows-2025 runners install-action fails to start its own bash ("bash startup failure",
    # actions/partner-runner-images#169) on every run, while Git Bash itself works (the step above).
    # nextest's official installer runs in Git Bash and verifies the archive's SHA-256 before installing
    # (https://nexte.st/docs/installation/pre-built-binaries/); 0.9 is the stable series.
    - name: Install nextest (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: curl -LsSf https://get.nexte.st/install.sh | sh -s -- --version 0.9

    # Caches are saved only from main and release branches: a pull request's cache is visible to that pull
    # request alone and would evict the main cache every pull request restores (10 GB per repository).
    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

    - name: Format
      if: ${{ inputs.tests == 'true' }}
      shell: bash
      run: cargo fmt --all -- --check

    - name: Clippy
      shell: bash
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Test
      if: ${{ inputs.tests == 'true' && inputs.defer-tests != 'true' }}
      shell: bash
      run: cargo nextest run --workspace --locked --profile ci

    - name: Build tests (already tested in the pull request)
      if: ${{ inputs.tests != 'true' }}
      shell: bash
      run: cargo nextest run --workspace --locked --no-run

    - name: Doctests
      if: ${{ inputs.tests == 'true' && inputs.defer-tests != 'true' }}
      shell: bash
      run: cargo test --workspace --locked --doc
