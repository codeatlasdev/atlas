version: 2
# cooldown: a new version waits 7 days before a PR, so a compromised or yanked release is usually caught
# upstream before it reaches us (zizmor dependabot-cooldown).
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    # windows/windows-core must be the exact versions webview2-com (via tauri/wry) builds on: their COM traits
    # (`Interface::cast`) are per-version, so a lone bump breaks the Windows build (#156). They move with webview2-com.
    ignore:
      - dependency-name: "windows"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "windows-core"
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      site-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "chore(ci)" }
