name: CI

# Runs on pull requests (forks included: read-only token, no secrets are used) and on pushes to main and
# release branches. The same gate runs locally with `bun run check`. The ruleset requires one check from this file, `CI` (the last job), so jobs can be renamed,
# added or split without touching the ruleset.
on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main and release branches are never
# cancelled: they save the caches every pull request restores.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # On a push, `tested` is true when the commit has exactly the tree its pull request passed CI with
  # (scripts/ci-tested.sh). Then the push only rebuilds what keeps the cache warm and skips the rest.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Already tested in its pull request?
        id: tested
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: echo "tested=$(scripts/ci-tested.sh "$REPO" "$SHA")" | tee -a "$GITHUB_OUTPUT"

  rust-macos:
    name: Rust (macOS)
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-gate
        with:
          tests: ${{ needs.plan.outputs.tested != 'true' }}

  # The whole workspace, Atlas Desktop included (Linux build: WebKitGTK, xterm.js terminals).
  rust-linux:
    name: Rust (Linux)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System libraries (Tauri/WebKitGTK)
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: ./.github/actions/rust-gate
        with:
          tests: ${{ needs.plan.outputs.tested != 'true' }}

  frontend:
    name: Desktop frontend + skills
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Skills
        run: scripts/check-skills.sh

      - name: svelte-check, prettier, bun test
        run: bun run desktop:check

  site:
    name: Site build
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile

      # astro check + type-check of site/scripts and site/functions.
      - name: Type-check
        working-directory: site
        run: bun run check

      # Heavy media is not in git (see docs/site.md); the build does not need it.
      - name: Build
        working-directory: site
        run: bun run build

  duplication:
    name: Duplication (jscpd, <= 1.5%)
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # Config and ignores: .jscpd.json. Exits non-zero above the threshold.
      - name: jscpd
        run: bun run dup

  deny:
    name: cargo-deny
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # actionlint (syntax, expressions, shellcheck of run: blocks) and zizmor (security audit) over every
  # workflow and action. Config: .github/zizmor.yml. Same commands as `bun run check`.
  workflows:
    name: Workflow lint
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: zizmor

      # install-action has no actionlint; Go (preinstalled on the runner) verifies the module against
      # sum.golang.org. Keep the version in step with scripts/setup.sh.
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: scripts/lint-workflows.sh

  # The one required check. A skipped job counts as passed only when `plan` passed and said the tree was
  # already tested; a job skipped because something it needs failed shows "skipped" too, so `!cancelled()`
  # plus this explicit check is what keeps a broken run from going green.
  ci:
    name: CI
    needs: [plan, rust-macos, rust-linux, frontend, site, duplication, deny, workflows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJson(needs) }}
          TESTED: ${{ needs.plan.outputs.tested }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e --arg tested "$TESTED" 'to_entries | all(
            .value.result == "success"
            or (.value.result == "skipped" and .key != "plan" and $tested == "true"))' <<<"$NEEDS" >/dev/null
