name: CI

on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock']
  pull_request:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Build
        run: cargo build -p atlas-tui -p atlas-cli

      - name: Test
        run: cargo test -p atlas-tui -p atlas-cli

      - name: Clippy
        run: cargo clippy -p atlas-tui -p atlas-cli -- -D warnings

      - name: Check formatting
        run: cargo fmt -p atlas-tui -p atlas-cli -- --check
