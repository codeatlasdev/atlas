name: CI

# Runs on pull requests (forks included: read-only token, no secrets are used) and on pushes to main.
# The same gate runs locally with `bun run check`; `bun run ci:act` runs this file through act.
on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust-macos:
    name: Rust (macOS, full workspace)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; rustup installs it (with rustfmt + clippy) on first use.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # nextest
        with:
          tool: nextest

      - name: Cache cargo
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      - name: Doctests
        run: cargo test --workspace --locked --doc

  # The job name is a required check (ruleset): it keeps its old wording although it now covers the
  # whole workspace, Atlas Desktop included (Linux build: WebKitGTK, xterm.js terminals).
  rust-linux:
    name: Rust (Linux, without the macOS-only crates)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: System libraries (Tauri/WebKitGTK)
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # nextest
        with:
          tool: nextest

      - name: Cache cargo
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      - name: Doctests
        run: cargo test --workspace --locked --doc

  frontend:
    name: Desktop frontend + skills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Skills
        run: scripts/check-skills.sh

      - name: svelte-check, prettier, bun test
        run: bun run desktop:check

  site:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile

      # astro check + type-check of site/scripts and site/functions.
      - name: Type-check
        working-directory: site
        run: bun run check

      # Heavy media is not in git (see docs/site.md); the build does not need it.
      - name: Build
        working-directory: site
        run: bun run build

  duplication:
    name: Duplication (jscpd, <= 1.5%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Config and ignores: .jscpd.json. Exits non-zero above the threshold.
      - name: jscpd
        run: bun run dup

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
