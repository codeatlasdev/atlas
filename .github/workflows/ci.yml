name: CI

# Runs on pull requests (forks included: read-only token, no secrets are used) and on pushes to main and
# release branches. The same gate runs locally with `bun run check`. The ruleset requires one check from this file, `CI` (the last job), so jobs can be renamed,
# added or split without touching the ruleset.
on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main and release branches are never
# cancelled: they save the caches every pull request restores.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # On a push, `tested` is true when the commit has exactly the tree its pull request passed CI with
  # (scripts/ci-tested.sh). Then the push only rebuilds what keeps the cache warm and skips the rest.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
      rust: ${{ steps.paths.outputs.rust }}
      desktop: ${{ steps.paths.outputs.desktop }}
      i18n: ${{ steps.paths.outputs.i18n }}
      skills: ${{ steps.paths.outputs.skills }}
      scripts: ${{ steps.paths.outputs.scripts }}
      mobile: ${{ steps.paths.outputs.mobile }}
      relay: ${{ steps.paths.outputs.relay }}
      site: ${{ steps.paths.outputs.site }}
      installer: ${{ steps.paths.outputs.installer }}
      workflows: ${{ steps.paths.outputs.workflows }}
      dup: ${{ steps.paths.outputs.dup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # Which areas the change touches (scripts/checks/map.ts, the one map `bun run check` and `bun run check:changed`
      # read too): a docs-only commit skips the Rust, mobile and frontend jobs; an unknown path, a changed workflow, a
      # workflow_dispatch or a missing diff runs everything. The base is the pull request's merge-ref first parent, or
      # the commit this push replaced (scripts/lib/base.ts).
      - name: Changed areas
        id: paths
        # `shell: bash` runs with pipefail: a failed plan must fail the job, not leave every output empty (every job skipped).
        shell: bash
        run: bun scripts/ci-plan.ts | tee -a "$GITHUB_OUTPUT"

      - name: Already tested in its pull request?
        id: tested
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: echo "tested=$(scripts/ci-tested.sh "$REPO" "$SHA")" | tee -a "$GITHUB_OUTPUT"

  rust-macos:
    name: Rust (macOS)
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-gate
        with:
          tests: ${{ needs.plan.outputs.tested != 'true' }}

  # The whole workspace, Atlas Desktop included (Linux build: WebKitGTK, xterm.js terminals).
  rust-linux:
    name: Rust (Linux)
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ffmpeg: the Linux recorder's tests encode a real file (#282). Cached and bounded (#604): the mirror once held this step for 36 min.
      - name: System libraries (Tauri/WebKitGTK)
        timeout-minutes: 8
        uses: ./.github/actions/apt-packages
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev fish ffmpeg

      - uses: ./.github/actions/rust-gate
        with:
          tests: ${{ needs.plan.outputs.tested != 'true' }}

  # The Linux app, opened: the debug build with the frontend bundled runs on a private headless sway (Mesa
  # llvmpipe, no GPU) and fails on a crash, a window that never maps, a blank page or an error in the app's log
  # (scripts/linux-launch-check.sh, #283). Principle: Linux ships nothing that no CI job has opened. The screenshot
  # is uploaded so a failure shows what the page looked like. When `atlas desktop --agent` works on Linux, the
  # script's log steps can read `atlas desktop debug logs` instead.
  desktop-linux:
    name: Desktop opens (Linux)
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cached and bounded (#604): the mirror once held this step for 25+ min.
      - name: System libraries (Tauri/WebKitGTK) and the headless display (sway, grim, Mesa llvmpipe)
        timeout-minutes: 8
        uses: ./.github/actions/apt-packages
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev sway grim dbus libgl1-mesa-dri libegl1 libgles2 xwayland fonts-dejavu-core

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # Caches are saved only from main and release branches (same rule as the rust-gate action).
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

      # tauri/custom-protocol is what `cargo tauri build` adds: the app serves the bundled frontend (the CSP and
      # IPC a user gets) instead of waiting for the dev server.
      - name: Build the app with the bundled frontend
        run: |
          (cd apps/desktop && bun install --frozen-lockfile && bun run build)
          cargo build --locked -p atlas-cli
          cargo build --locked -p atlas-desktop --features tauri/custom-protocol

      # WebKitGTK's own sandbox (bubblewrap) needs unprivileged user namespaces, which the runner's AppArmor policy
      # denies; without this the web process aborts at start. Everything else is what a user gets.
      - name: Open it
        run: |
          scripts/linux-launch-check.sh --out launch-check-out \
            --env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            --env ATLAS_BIN="$PWD/target/debug/atlas" target/debug/atlas-desktop

      # What the app costs before the user does anything (#284): start to app_ready (1 cold, 4 warm), memory per process
      # at idle, idle CPU. Fails over the budget in scripts/linux-startup-bench.ts, which is set from docs/perf/linux-startup.json.
      - name: Startup and idle baseline
        run: |
          bun scripts/linux-startup-bench.ts --out startup-bench-out/report.json \
            --env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            --env ATLAS_BIN="$PWD/target/debug/atlas" target/debug/atlas-desktop

      - name: Screenshot and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-launch-check
          path: launch-check-out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Startup report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-startup-bench
          path: startup-bench-out/
          if-no-files-found: ignore
          retention-days: 30

  # The release's Linux aarch64 CLI (crew servers on Graviton, Oracle A1, Hetzner CAX) is built on
  # `ubuntu-22.04-arm`, and `publish` waits for it. Building it here on every push to main means a
  # break on that target (a dependency, the runner image) shows on main, not in the middle of a
  # release. Not on pull requests: the native arm64 runner is the slow, scarce one.
  rust-linux-arm64:
    name: Rust (Linux aarch64 CLI)
    needs: plan
    if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.rust == 'true' }}
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System libraries
        timeout-minutes: 8
        uses: ./.github/actions/apt-packages
        with:
          packages: build-essential curl pkg-config libssl-dev

      # Same steps as the release job (release.yml, build-linux-arm64): the arm64 image may lack rustup.
      - name: Install Rust
        run: |
          command -v rustup >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install

      - name: Build the CLI
        run: cargo build --locked -p atlas-cli

  # Windows: the whole workspace, Atlas Desktop included (WebView2, xterm.js terminals over ConPTY),
  # and the Windows end-to-end hostd test (named pipe, ConPTY, cmd.exe). No Unix tools assumed.
  rust-windows:
    name: Rust (Windows, full workspace)
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.rust == 'true' }}
    runs-on: windows-latest
    # A normal run takes 5-12 min (Test step 3-6, Doctests under 1). A runner that froze mid-step never runs a step timeout
    # (#520) and GitHub only notices ~45-50 min later. The job's own limit is kept by the service (a frozen job "runs to the
    # job cap", actions/runner-images#14938) and is above the sum of the step limits (gate ~4 + Test 15 + Doctests 5), so a
    # job that ends by it is a stalled runner, which ci-rerun-lost (scripts/ci-lost-runner.ts, `stalled`) reruns after 30 min
    # instead of ~50. The next loss shows whether the service ends it: "exceeded the maximum execution time of 30m0s" in
    # place of "lost communication".
    timeout-minutes: 30
    # `checks: write` only for the watchdog's check run (scripts/ci-watchdog.ps1, issue #520). A fork's pull request
    # gets a read-only token whatever is declared here: the watchdog then keeps to the log.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything but the tests (toolchain, nextest, cache, fmt, clippy). The tests are steps of this job, not of
      # the action: a composite step cannot have `timeout-minutes`.
      - uses: ./.github/actions/rust-gate
        with:
          tests: ${{ needs.plan.outputs.tested != 'true' }}
          defer-tests: "true"

      # Issue #520: this job lost its runner 10 times since 2026-11-15 ("The hosted runner lost communication with
      # the server" after exactly 50 min), 4 times in this step with its step timeout never firing, so the runner
      # itself died or froze; the job's live log is not kept either. The tests take 3-4 min. What this step leaves:
      # - a hang in the tests fails the step after 15 min with its log (nextest ends a single test after 3 min,
      #   `.config/nextest.toml`), instead of taking the runner with it; the log is a file as well, to upload below;
      # - scripts/ci-watchdog.ps1 samples memory, commit charge, page file, handles, disk queue and free space, the
      #   top processes and the tests running now every 15 s, to the live log, to `watchdog.log` and, off the runner,
      #   to a check run "Windows test telemetry (#520)" updated every 30 s (the one place that outlives a lost
      #   runner). It says when a runner process disappears and kills a test process that holds the runner's memory.
      #   `watchdog.stop` ends it when the tests end. The token goes to the watchdog alone: it is unset before the
      #   tests start.
      - name: Test
        if: ${{ needs.plan.outputs.tested != 'true' }}
        timeout-minutes: 15
        shell: bash
        env:
          WATCHDOG_TOKEN: ${{ github.token }}
          WATCHDOG_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rm -f watchdog.stop
          pwsh -NoProfile -File scripts/ci-watchdog.ps1 &
          watchdog=$!
          unset WATCHDOG_TOKEN
          stop_watchdog() { touch watchdog.stop; sleep 6; kill "$watchdog" 2>/dev/null || true; }
          trap stop_watchdog EXIT
          cargo nextest run --workspace --locked --profile ci 2>&1 | tee nextest.log

      - name: Doctests
        if: ${{ needs.plan.outputs.tested != 'true' }}
        timeout-minutes: 5
        shell: bash
        run: cargo test --workspace --locked --doc

      # What the next hang or runner loss shows: the nextest log (SLOW/TIMEOUT lines name the test that hung), the
      # JUnit report (every test with its time) and the watchdog's samples, kept briefly.
      - name: Nextest log and JUnit report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-windows-${{ github.run_attempt }}
          path: |
            nextest.log
            watchdog.log
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 3

  # The tests that need root (crew isolation, issue #200): a real cross-uid spawn and a real useradd. GitHub's
  # Ubuntu runners have passwordless sudo, and the runner is thrown away, so creating system users is fine. The
  # tests are `#[ignore]`d in every other job (docs/contributing.md, "Tests that need root").
  rust-linux-root:
    name: Rust (Linux, root tests)
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      # No cargo cache here on purpose: a job that later runs as root should not restore build
      # outputs another run produced (zizmor cache-poisoning), and atlas-host alone builds in minutes.
      # Build as the runner user, run as root: root never writes the target dir it did not build.
      - name: Build the root tests
        run: cargo test -p atlas-host --lib --locked --no-run

      - name: Run the root tests
        run: sudo -E env "PATH=$PATH" cargo test -p atlas-host --lib --locked crew::spawn -- --ignored

  frontend:
    name: Desktop frontend + skills
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && (needs.plan.outputs.desktop == 'true' || needs.plan.outputs.skills == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Skills
        run: scripts/check-skills.sh

      - name: svelte-check, prettier, bun test
        run: bun run desktop:check

  # Catalogs, locks, glossary, translated docs, the writing lint and the hardcoded-text ratchets (scripts/i18n). Offline
  # and bun only, so a Rust-only or docs-only change that can break a catalog or add a println! still reaches it. The
  # ratchets judge every file against the baseline (and the files a change touches against the diff base of
  # scripts/lib/base.ts, so the history is fetched). It runs on every push to main and release branches even when the
  # commit's tree was tested in its pull request: two pull requests that each pass alone can break the baseline together
  # (merge skew), and only a run on the merged tree sees it. It takes about a second.
  i18n:
    name: i18n (catalogs, writing, ratchets)
    needs: plan
    if: ${{ github.event_name == 'push' || (needs.plan.outputs.tested != 'true' && needs.plan.outputs.i18n == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: i18n
        run: bun run i18n:check

  # The repo's own scripts (setup, heavy queue, CI gates, release helpers) and their tests, on Linux and on Windows
  # through Git Bash (`scripts/sh.ts`), so a contributor's `bun run check` keeps working on both (#260).
  scripts:
    name: Repo scripts (${{ matrix.os }})
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.scripts == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # ffmpeg: the flicker-sweep judge tests record with it. Cached and bounded (#604): a slow mirror once ate the job's 15 min.
      - name: ffmpeg
        if: runner.os == 'Linux'
        timeout-minutes: 8
        uses: ./.github/actions/apt-packages
        with:
          packages: ffmpeg

      - name: PyYAML (scripts/test-labels.sh)
        shell: bash
        run: bash scripts/py.sh -c "import yaml" 2>/dev/null || bash scripts/py.sh -m pip install --quiet pyyaml

      - name: bun run release:test
        run: bun run release:test

  # site/public/install.ps1 as a user runs it (`irm <url> | iex`) in Windows PowerShell 5.1 (powershell.exe, what a
  # stock Windows has) and PowerShell 7, against a local server that plays GitHub (scripts/install-ps1.test.ts).
  install-ps1:
    name: Installer (Windows PowerShell 5.1 and 7)
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.installer == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: install.ps1 in powershell.exe and pwsh
        run: bun test scripts/install-ps1.test.ts

  mobile:
    name: Mobile app
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: apps/mobile/pubspec.yaml
          channel: stable

      - name: Native crate builds
        run: cargo build --locked --manifest-path apps/mobile/native/Cargo.toml

      # The bindings generator at the version native/Cargo.toml pins, so mobile-check.sh can prove
      # lib/src/rust matches api.rs (it fails in CI without it).
      - name: Bindings generator version
        id: frb
        run: echo "v=$(sed -n 's/^flutter_rust_bridge = "=\([0-9.]*\)"$/\1/p' apps/mobile/native/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install flutter_rust_bridge_codegen
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: flutter_rust_bridge_codegen@${{ steps.frb.outputs.v }}

      - name: analyze, flutter test
        run: scripts/mobile-check.sh

      # A failed golden leaves the image this runner drew (and the diff) in test/failures:
      # the goldens are recorded from these Linux images (docs/mobile.md, "Goldens").
      - name: Golden failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-golden-failures
          path: apps/mobile/test/failures/
          if-no-files-found: ignore
          retention-days: 7

  push-relay:
    name: Push relay (Go)
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/push-relay/go.mod
          cache: false

      - name: gofmt, go vet, go test
        run: scripts/push-relay-check.sh

  site:
    name: Site build
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile

      # astro check + type-check of site/scripts and site/functions.
      - name: Type-check
        working-directory: site
        run: bun run check

      # Heavy media is not in git (see docs/site.md); the build does not need it.
      - name: Build
        working-directory: site
        run: bun run build

  duplication:
    name: Duplication (jscpd, <= 1.5%)
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.dup == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # Config and ignores: .jscpd.json. Exits non-zero above the threshold.
      - name: jscpd
        run: bun run dup

  deny:
    name: cargo-deny
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # actionlint (syntax, expressions, shellcheck of run: blocks) and zizmor (security audit) over every
  # workflow and action. Config: .github/zizmor.yml. Same commands as `bun run check`.
  workflows:
    name: Workflow lint
    needs: plan
    if: ${{ needs.plan.outputs.tested != 'true' && needs.plan.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor

      # install-action has no actionlint; Go (preinstalled on the runner) verifies the module against
      # sum.golang.org. Keep the version in step with scripts/setup.sh.
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: scripts/lint-workflows.sh

  # The one required check. A skipped job counts as passed only when `plan` passed and said the tree was
  # already tested; a job skipped because something it needs failed shows "skipped" too, so `!cancelled()`
  # plus this explicit check is what keeps a broken run from going green.
  ci:
    name: CI
    needs: [plan, rust-macos, rust-linux, desktop-linux, rust-linux-root, rust-linux-arm64, rust-windows, frontend, i18n, scripts, install-ps1, mobile, push-relay, site, duplication, deny, workflows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          # A job may be skipped only when plan decided so: the tree was already tested, or the change does not
          # touch its area. Plan itself must succeed, and nothing may fail or be cancelled.
          jq -e 'to_entries | all(
            .value.result == "success"
            or (.value.result == "skipped" and .key != "plan"))' <<<"$NEEDS" >/dev/null
          [ "$(jq -r .plan.result <<<"$NEEDS")" = success ]
