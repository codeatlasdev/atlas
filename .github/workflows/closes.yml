name: Closing keywords

# After every push to main: a squash commit may close only the issues its pull request links
# (`closingIssuesReferences`). A hand-typed `Closes #503` once closed the wrong issue (f44c293d, PR #509); this job
# fails when that happens again and says so on the pull request. `bun run pr:merge` writes bodies that pass.
# Runs trusted code from main on a push, never on a pull request, so the token may comment.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: closes-${{ github.sha }}
  cancel-in-progress: false

jobs:
  closes:
    name: Closing keywords match the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Check the squash commits pushed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bun scripts/main-closes-check.ts --repo "$REPO" --range "$BEFORE..$AFTER" --comment
