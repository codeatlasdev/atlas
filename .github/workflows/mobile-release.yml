name: Mobile release

# Atlas Mobile, from a `mobile-v1.2.0` tag to the stores, through fastlane
# (apps/mobile/fastlane/Fastfile):
#   1. unattended: build, sign, upload to TestFlight and the Play internal testing track; on a tag, the
#      tag's GitHub release appears as a pre-release with Play's universal APK of that build;
#   2. after a maintainer approves the `mobile-store` environment: that same build goes to App
#      Store review (released on approval) and to Play production (every user at once), and the
#      pre-release becomes a normal release. Never "Latest" (scripts/mobile-apk-release.sh).
# Not approved, it stays with testers. Both stores share one build number (the run's start, in
# minutes), and the version comes from the tag. Secrets: docs/mobile.md, "Releases".
#
# A pull request that touches this release path runs only the rehearsal: both store builds made
# exactly as a release makes them, unsigned, never uploaded, with no secret and no environment.
on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mobile-release.yml
      - .github/actions/mobile-store-setup/**
      - apps/mobile/fastlane/**
      - apps/mobile/Gemfile
      - apps/mobile/Gemfile.lock
      - apps/mobile/.ruby-version
      - apps/mobile/ios/**
      - apps/mobile/android/**
      - apps/mobile/pubspec.yaml
      - apps/mobile/pubspec.lock

permissions:
  contents: read

concurrency:
  # Publishing runs queue behind each other; a pull request's rehearsal is replaced by its next push.
  group: ${{ github.event_name == 'pull_request' && format('mobile-rehearsal-{0}', github.event.pull_request.number) || 'mobile-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing reaches testers or the stores from a commit CI did not pass (#311), the same gate as
  # release.yml. `github.sha` is the tagged commit on a tag push and the chosen ref on a dispatch.
  rehearsal:
    name: Rehearsal (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-latest
            targets: aarch64-apple-ios
          - platform: android
            os: ubuntu-latest
            targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/mobile-store-setup
        with:
          targets: ${{ matrix.targets }}

      - name: Store build, unsigned
        working-directory: apps/mobile
        env:
          LANE: ${{ matrix.platform }}_rehearse
        run: bundle exec fastlane "$LANE"

  gate:
    name: CI gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/ci-passed.sh "$REPO" "$SHA"

  number:
    name: Version and build number
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      n: ${{ steps.n.outputs.n }}
      version: ${{ steps.n.outputs.version }}
    steps:
      - id: n
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "n=$(( $(date +%s) / 60 ))" >> "$GITHUB_OUTPUT"
          # mobile-v1.2.0 -> 1.2.0; a run by hand keeps pubspec.yaml's version.
          v="${REF#mobile-v}"
          if [[ "$REF" == mobile-v* ]]; then
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be mobile-vX.Y.Z, got $REF"; exit 1; }
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: TestFlight
    needs: number
    runs-on: macos-latest
    timeout-minutes: 60
    environment: mobile-beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/mobile-store-setup
        with:
          targets: aarch64-apple-ios

      - name: Build and upload
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
          VERSION: ${{ needs.number.outputs.version }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
          BETA_FEEDBACK_EMAIL: ${{ vars.BETA_FEEDBACK_EMAIL }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: bundle exec fastlane ios_beta

      # `flutter symbolize` needs these to read a stack trace of this build (the Dart symbols are not in the binary).
      - name: Keep the Dart symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-symbols-ios-${{ needs.number.outputs.n }}
          path: apps/mobile/build/symbols/ios
          if-no-files-found: error

  android:
    name: Play internal testing
    needs: number
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile-beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/mobile-store-setup
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Build and upload
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
          VERSION: ${{ needs.number.outputs.version }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bundle exec fastlane android_beta

      # `flutter symbolize` needs these to read a stack trace of this build (the Dart symbols are not in the binary).
      - name: Keep the Dart symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-symbols-android-${{ needs.number.outputs.n }}
          path: apps/mobile/build/symbols/android
          if-no-files-found: error

  apk:
    name: APK on the tag (pre-release)
    # A tag's release page shows the build testers have; a run by hand has no tag to put it on.
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [number, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile-beta
    permissions:
      contents: write # the tag's GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          working-directory: apps/mobile

      - name: fastlane
        working-directory: apps/mobile
        run: bundle install

      # Play's own universal APK, signed with its app signing key: it and a Play Store install update each other.
      # Play generates it a few minutes after the upload, so this stage waits for it.
      - name: Universal APK from Play
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
          VERSION: ${{ needs.number.outputs.version }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APK_WAIT_MINUTES: "20"
        run: bundle exec fastlane android_apk

      - name: Pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.number.outputs.version }}
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
        run: scripts/mobile-apk-release.sh testing "$TAG" "$VERSION" "$BUILD_NUMBER"

  store:
    name: To the stores (needs approval)
    # Only a tagged release can go public; a run by hand is for testers.
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [number, ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Required reviewers on this environment hold the job until one of them approves.
    environment: mobile-store
    permissions:
      contents: write # the tag's GitHub release with the APK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          working-directory: apps/mobile

      - name: fastlane
        working-directory: apps/mobile
        run: bundle install

      - name: Promote the tested build
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
          VERSION: ${{ needs.number.outputs.version }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane release

      # The pre-release of step 1 becomes a normal release (still not "Latest"). The APK is fetched again so a tag
      # whose testing stage failed still gets it; Play has it by now, so no wait.
      - name: Universal APK from Play
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
          VERSION: ${{ needs.number.outputs.version }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android_apk

      - name: Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.number.outputs.version }}
          BUILD_NUMBER: ${{ needs.number.outputs.n }}
        run: scripts/mobile-apk-release.sh store "$TAG" "$VERSION" "$BUILD_NUMBER"
