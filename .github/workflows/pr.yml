name: Pull request

# Checks on the pull request itself, not the code: every commit signed off (DCO), and a title that is a
# Conventional Commits subject (squash merge makes it the commit subject on main). Both are required checks.
# `pull_request`, never `pull_request_target`: no secrets and a read-only token, forks included.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: Signed-off-by
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The title goes through env, never `${{ }}` inside the script: it is attacker-controlled text.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-pr-title.sh "$TITLE"
