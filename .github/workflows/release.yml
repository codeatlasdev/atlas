name: Release
run-name: ${{ inputs.build_only && 'Build only' || 'Release' }} ${{ inputs.tag || github.ref_name }}

# Runs on GitHub-hosted runners when a v* tag is pushed (`bun run release` pushes it), or by hand for an
# existing tag (`bun run release --publish vX.Y.Z`, which dispatches this workflow from main with `tag`).
# Publishes only after the CI run of the tagged commit passed (scripts/ci-passed.sh) and after every Linux
# package and the AppImage were installed and opened in Arch, Fedora, Ubuntu and Debian containers (verify-linux).
#
# Build only (`gh workflow run release.yml --ref <branch> -f build_only=true`, docs/release.md): builds and verifies
# every artifact from the branch, uploads them as workflow artifacts, and creates no tag and no release, so main can
# be tested end to end before a release. The Windows signing jobs are skipped; macOS is Developer ID signed and
# notarized only for a build-only run of main (never of a branch) and only when the secrets exist; `publish` never runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (vX.Y.Z[-pre.N]); not used with build_only
        required: false
        type: string
      build_only:
        description: Build and verify every artifact from the selected ref; no tag, no release, no signing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A build-only run names its files after a throwaway valid prerelease version (the Arch package version is
  # rendered from it) and builds the dispatched commit; a release builds the tag.
  TAG: ${{ inputs.build_only && format('v0.0.0-alpha.{0}', github.run_number) || inputs.tag || github.ref_name }}
  REF: ${{ inputs.build_only && github.sha || format('refs/tags/{0}', inputs.tag || github.ref_name) }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    steps:
      # The script comes from the workflow's own ref (main on a dispatch): an older tag may predate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: A release dispatch names its tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only && inputs.tag == '' }}
        run: |
          echo "::error::dispatch with tag=vX.Y.Z to publish, or build_only=true to build without publishing"
          exit 1

      - name: CI passed on the tagged commit
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/ci-passed.sh "$REPO" "$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"

  build:
    name: Build (aarch64-apple-darwin)
    needs: gate
    # macos-14 was retired by GitHub ("The configuration 'macos-14-arm64-us-default' is not supported", 2026-11-12:
    # the job was cancelled in 1 s and nothing was published). Same Apple-silicon image family as CI.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - uses: ./.github/actions/release-toolchain

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p atlas-cli

      # CycloneDX SBOM of the CLI's dependency tree (the shipped binary). Skipped, loudly, when the tool is missing.
      - name: SBOM
        run: |
          ATLAS_VERSION=${TAG#v}
          mkdir -p dist
          if command -v cargo-cyclonedx >/dev/null || cargo install cargo-cyclonedx --locked; then
            cargo cyclonedx --manifest-path crates/atlas-cli/Cargo.toml --format json \
              --target aarch64-apple-darwin --override-filename atlas-cli-sbom
            # cargo-cyclonedx writes one file per workspace member; keep the CLI's, drop the rest.
            mv crates/atlas-cli/atlas-cli-sbom.json "dist/atlas-${ATLAS_VERSION}-sbom.cdx.json"
            rm -f crates/*/atlas-cli-sbom.json
          else
            echo "::warning::cargo-cyclonedx is not available: this release has no SBOM"
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # Developer ID signing and notarization (docs/release.md, "macOS signing and notarization"). On when all six
      # secrets exist (MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY, APPLE_API_KEY_ID,
      # APPLE_API_ISSUER, APPLE_API_KEY_P8) and the run is a release or a build-only run of main (a branch's build-only run
      # never gets the certificate). With none of them, or on a fork, the build stays ad-hoc signed exactly as before and
      # says so; some but not all is a configuration error and fails here, so a half-set-up release cannot ship ad-hoc.
      # The certificate lives in a temporary keychain that the last step of the job deletes. Secrets reach the steps only
      # through env, never a command line: `security import -P` has no stdin form, so the .p12 is re-encrypted first
      # under a throwaway password and only that one appears in argv.
      - name: macOS signing setup
        id: sign
        shell: bash
        env:
          ELIGIBLE: ${{ !inputs.build_only || github.ref == 'refs/heads/main' }}
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          adhoc() {
            echo "::notice title=macOS build is ad-hoc signed::$1 Gatekeeper warns on the dmg and the firewall asks again after every update (docs/release.md)."
            echo "developer-id=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$ELIGIBLE" = true ] || adhoc "A build-only run of a branch never gets the Developer ID certificate."
          missing=""
          have=0
          for pair in MACOS_CERTIFICATE_P12_BASE64:CERT_P12_BASE64 MACOS_CERTIFICATE_PASSWORD:CERT_PASSWORD MACOS_SIGNING_IDENTITY:SIGNING_IDENTITY \
                      APPLE_API_KEY_ID:API_KEY_ID APPLE_API_ISSUER:API_ISSUER APPLE_API_KEY_P8:API_KEY_P8; do
            var=${pair#*:}
            if [ -n "${!var}" ]; then have=$((have + 1)); else missing="$missing ${pair%%:*}"; fi
          done
          [ "$have" -gt 0 ] || adhoc "No Developer ID secret is configured (a fork, or not set up yet)."
          if [ -n "$missing" ]; then
            echo "::error::macOS signing is half configured, missing secrets:$missing"
            exit 1
          fi

          KC="$RUNNER_TEMP/atlas-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          export KEYCHAIN_PASSWORD
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert-in.p12"
          # Re-encrypted for `security` in the legacy PKCS#12 form it reads (scripts/macos-keychain-import.sh, tested on
          # macOS with OpenSSL 3 and LibreSSL; OpenSSL 3's default made the first run fail with "MAC verification failed").
          bash scripts/macos-keychain-import.sh "$RUNNER_TEMP/cert-in.p12" "$KC"
          rm -f "$RUNNER_TEMP/cert-in.p12"
          set -- "$KC"
          while IFS= read -r k; do set -- "$@" "$k"; done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychains -d user -s "$@"
          if ! security find-identity -v -p codesigning "$KC" | grep -F "\"$SIGNING_IDENTITY\"" > /dev/null; then
            echo "::error::the imported certificate is not a valid code-signing identity named like MACOS_SIGNING_IDENTITY; the keychain holds:"
            security find-identity -p codesigning "$KC"
            exit 1
          fi
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "developer-id=true" >> "$GITHUB_OUTPUT"

      # With the Developer ID on, Tauri signs Atlas.app (hardened runtime, crates/atlas-desktop/Entitlements.plist) and the
      # dmg with APPLE_SIGNING_IDENTITY, then notarizes and staples the app (APPLE_API_KEY / APPLE_API_ISSUER /
      # APPLE_API_KEY_PATH). The variables are exported only then: Tauri reads an empty APPLE_SIGNING_IDENTITY as an
      # identity named "", which would break the ad-hoc build. Tauri 2.11's codesign call has no --timestamp and codesign
      # adds none by default (measured: no `Timestamp=` in `codesign -dvv`), but notarization refuses a signature without
      # a secure timestamp; a `codesign` first on PATH that adds the flag makes Tauri's signatures notarizable.
      - name: Build desktop app
        env:
          DEVELOPER_ID: ${{ steps.sign.outputs.developer-id }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "$(scripts/setup.sh --tauri-version)" --locked
          (cd apps/desktop && bun install --frozen-lockfile)
          if [ "$DEVELOPER_ID" = true ]; then
            export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY" APPLE_API_KEY="$API_KEY_ID" APPLE_API_ISSUER="$API_ISSUER" \
              APPLE_API_KEY_PATH="$RUNNER_TEMP/notary.p8"
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec /usr/bin/codesign --timestamp "$@"\n' > "$RUNNER_TEMP/bin/codesign"
            chmod +x "$RUNNER_TEMP/bin/codesign"
            export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          (cd crates/atlas-desktop && cargo tauri build --target aarch64-apple-darwin --bundles app,dmg --ci)

      # The CLI is signed here (hardened runtime, secure timestamp, Entitlements-cli.plist) and notarized as a zip; a bare
      # binary cannot be stapled, so Gatekeeper checks its ticket online on first run. The dmg is notarized and stapled
      # BEFORE Package copies it, because stapling changes its bytes and Package writes the .sha256. Then every claim
      # the docs make is checked on the real files: signature, Team ID, hardened runtime, entitlements, Gatekeeper.
      - name: Developer ID signature, notarization and checks
        if: ${{ steps.sign.outputs.developer-id == 'true' }}
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          T=target/aarch64-apple-darwin/release
          CLI=$T/atlas
          APP=$T/bundle/macos/Atlas.app
          set -- "$T"/bundle/dmg/Atlas_*_aarch64.dmg
          DMG=$1
          TEAM=${SIGNING_IDENTITY##*(}
          TEAM=${TEAM%)*}

          codesign --force --sign "$SIGNING_IDENTITY" --options runtime --timestamp \
            --entitlements crates/atlas-desktop/Entitlements-cli.plist "$CLI"

          notarize() {
            local out status id
            out=$(xcrun notarytool submit "$1" --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" \
              --wait --timeout 45m --output-format json) || { echo "$out"; echo "::error::notarytool failed for $1"; return 1; }
            status=$(jq -r .status <<< "$out")
            id=$(jq -r .id <<< "$out")
            echo "notarization of $1: $status ($id)"
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" || true
              echo "::error::Apple did not accept $1 ($status)"
              return 1
            fi
          }
          ditto -c -k --keepParent "$CLI" "$RUNNER_TEMP/atlas-cli.zip"
          notarize "$RUNNER_TEMP/atlas-cli.zip"
          notarize "$DMG"
          xcrun stapler staple "$DMG"

          fail=0
          check() { if ! "$@"; then echo "::error::check failed: $*"; fail=1; fi; }
          # Output goes through a variable: `grep -q` closing the pipe early would fail the pipeline under pipefail.
          has() {
            local what=$1 pattern=$2 out
            shift 2
            out=$("$@" 2>&1) || true
            grep -E -- "$pattern" <<< "$out" > /dev/null || { echo "::error::$what: $* has no /$pattern/"; fail=1; }
          }
          check codesign --verify --deep --strict --verbose=2 "$APP"
          check codesign --verify --strict --verbose=2 "$CLI"
          check xcrun stapler validate "$APP"
          check xcrun stapler validate "$DMG"
          has "Gatekeeper rejects the app" "source=Notarized Developer ID" spctl -a -vvv -t exec "$APP"
          has "Gatekeeper rejects the dmg" "source=Notarized Developer ID" spctl -a -vvv -t open --context context:primary-signature "$DMG"
          for f in "$APP" "$CLI" "$DMG"; do
            has "wrong Team ID" "TeamIdentifier=$TEAM" codesign -dvv "$f"
            has "not Developer ID" "Authority=Developer ID Application" codesign -dvv "$f"
            has "no secure timestamp" "Timestamp=" codesign -dvv "$f"
          done
          for f in "$APP" "$CLI"; do has "no hardened runtime" "flags=0x[0-9a-f]+\(.*runtime" codesign -dvv "$f"; done
          has "app entitlements" "com.apple.security.device.audio-input" codesign -d --entitlements - "$APP"
          if grep get-task-allow <<< "$(codesign -d --entitlements - "$APP" "$CLI" 2>&1)" > /dev/null; then
            echo "::error::a notarized build must not carry get-task-allow"
            fail=1
          fi
          exit "$fail"

      - name: Package
        env:
          DEVELOPER_ID: ${{ steps.sign.outputs.developer-id }}
        run: |
          ATLAS_VERSION=${TAG#v}
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/atlas dist/
          chmod +x dist/atlas
          # Ad-hoc sign so macOS Gatekeeper doesn't SIGKILL on first run (a Developer ID build was signed above)
          if [ "$DEVELOPER_ID" != true ]; then
            codesign --sign - --force --preserve-metadata=entitlements,requirements,flags dist/atlas
          fi
          cd dist
          tar czf "atlas-${ATLAS_VERSION}-aarch64-apple-darwin.tar.gz" atlas
          shasum -a 256 "atlas-${ATLAS_VERSION}-aarch64-apple-darwin.tar.gz" > "atlas-${ATLAS_VERSION}-aarch64-apple-darwin.tar.gz.sha256"
          # Atlas Desktop: the .app tarball is what `atlas desktop` / `atlas update` install;
          # the .dmg is for people who download it by hand.
          BUNDLE=../target/aarch64-apple-darwin/release/bundle
          APP=Atlas-${ATLAS_VERSION}-aarch64-apple-darwin
          tar czf "${APP}.app.tar.gz" -C "${BUNDLE}/macos" Atlas.app
          cp "${BUNDLE}"/dmg/Atlas_*_aarch64.dmg "${APP}.dmg"
          shasum -a 256 "${APP}.app.tar.gz" > "${APP}.app.tar.gz.sha256"
          shasum -a 256 "${APP}.dmg" > "${APP}.dmg.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-aarch64-apple-darwin
          path: |
            dist/*.tar.gz*
            dist/*.dmg*
            dist/*.cdx.json

      # Runs when an earlier step failed too. Deleting the keychain also drops it from the search list.
      - name: Remove the signing keychain and keys
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/atlas-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/cert-in.p12" "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/atlas-cli.zip"

  # Linux x86_64: the CLI tarball, and Atlas Desktop as AppImage (what `atlas desktop` installs),
  # .deb and .rpm (both also carry the CLI as /usr/bin/atlas). Built on the oldest supported
  # Ubuntu so the binaries run on any glibc >= 2.35 (Arch, Fedora, Debian 12, Ubuntu 22.04+).
  build-linux:
    name: Build (x86_64-unknown-linux-gnu)
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - uses: ./.github/actions/release-toolchain
        with:
          apt: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Build CLI
        run: |
          cargo build --release --locked -p atlas-cli

      # tauri.linux.conf.json picks the deb/rpm/appimage bundles and puts target/release/atlas in the packages.
      # linuxdeploy (and its plugins) are AppImages; APPIMAGE_EXTRACT_AND_RUN unpacks them instead of mounting through FUSE, which the runner does not provide.
      - name: Build desktop app
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "$(scripts/setup.sh --tauri-version)" --locked
          (cd apps/desktop && bun install --frozen-lockfile)
          (cd crates/atlas-desktop && cargo tauri build --ci)

      - name: Package
        run: |
          V=${TAG#v}
          T=x86_64-unknown-linux-gnu
          B=target/release/bundle
          mkdir -p dist
          cp target/release/atlas dist/
          (cd dist && tar czf "atlas-$V-$T.tar.gz" atlas && rm atlas)
          # Our AppRun env and no host-ABI libs (#266): extract, patch, repack with a pinned appimagetool.
          AIT=appimagetool-1.9.1
          curl -fsSL -o "/tmp/$AIT" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/$AIT" | sha256sum -c -
          chmod +x "/tmp/$AIT"
          W=$(mktemp -d)
          APP=$(ls "$GITHUB_WORKSPACE/$B"/appimage/*.AppImage)
          (cd "$W" && "$APP" --appimage-extract >/dev/null)
          scripts/appimage-patch.sh "$W/squashfs-root"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "/tmp/$AIT" --no-appstream "$W/squashfs-root" "dist/Atlas-$V-$T.AppImage"
          cp "$B"/deb/*.deb "dist/atlas_${V}_amd64.deb"
          cp "$B"/rpm/*.rpm "dist/atlas-$V-1.x86_64.rpm"
          cd dist
          for f in *.tar.gz *.AppImage *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-x86_64-unknown-linux-gnu
          path: dist/*

  # Linux aarch64: the CLI tarball only, for crew servers on Graviton, Oracle A1 or Hetzner CAX
  # (`atlas crew install|update` downloads it). A native GitHub arm64 runner builds it; the desktop app is not
  # built for this target. Same oldest-Ubuntu rule as build-linux, so it runs on any glibc >= 2.35.
  build-linux-arm64:
    name: Build (aarch64-unknown-linux-gnu)
    needs: gate
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - uses: ./.github/actions/release-toolchain
        with:
          apt: libssl-dev

      - name: Build CLI
        run: |
          cargo build --release --locked -p atlas-cli

      - name: Package
        run: |
          V=${TAG#v}
          T=aarch64-unknown-linux-gnu
          mkdir -p dist
          cp target/release/atlas dist/
          cd dist
          tar czf "atlas-$V-$T.tar.gz" atlas
          rm atlas
          sha256sum "atlas-$V-$T.tar.gz" > "atlas-$V-$T.tar.gz.sha256"
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-aarch64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error

  # Windows x64: the CLI tarball (atlas.exe), Atlas Desktop's per-user NSIS installer (what
  # `atlas desktop` runs) and Atlas-Setup.exe, cross-compiled on Linux the way Tauri documents it
  # (cargo-xwin fetches the MSVC CRT and Windows SDK, makensis packs the installer). The installer also
  # carries atlas.exe, next to the app, so a desktop-only install can start hostd. tauri-cli checks the
  # build HOST for an appindicator library when the tray is on, even for a Windows target ("Can't detect
  # any appindicator library").
  #
  # Code signing (SignPath Foundation, docs/release.md "Windows code signing") needs the files in the
  # order they are embedded in one another, so the build is a chain of jobs:
  #   windows-binaries (atlas.exe, atlas-desktop.exe) -> sign-binaries
  #   -> windows-installer (NSIS, from the signed binaries) -> sign-installer
  #   -> windows-setup (Atlas-Setup.exe, around the signed NSIS) -> sign-setup
  #   -> build-windows (archive, renamed copies, checksums of the final bytes; what `publish` needs).
  # The sign-* jobs run only when the repository variable SIGNPATH_ENABLED is "true". Without it they
  # are skipped and the same chain ships today's unsigned artifacts under the same names. Every signing
  # request waits for a manual approval, so each one is its own job: the wait does not count against a
  # build job's timeout.
  windows-binaries:
    name: Build binaries (x86_64-pc-windows-msvc)
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - uses: ./.github/actions/release-toolchain
        with:
          apt: clang lld llvm nasm libayatana-appindicator3-dev
          targets: x86_64-pc-windows-msvc

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Build CLI
        run: |
          command -v cargo-xwin >/dev/null || cargo install cargo-xwin --locked
          cargo xwin build --release --locked --target x86_64-pc-windows-msvc -p atlas-cli

      # Only the app binary here (--no-bundle): the NSIS installer is packed later, from the signed files.
      - name: Build desktop app
        run: |
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "$(scripts/setup.sh --tauri-version)" --locked
          (cd apps/desktop && bun install --frozen-lockfile)
          (cd crates/atlas-desktop && cargo tauri build --ci --runner cargo-xwin \
            --target x86_64-pc-windows-msvc --no-bundle)

      # Flat, so atlas.exe and atlas-desktop.exe sit at the root of the zip SignPath receives
      # (packaging/windows/signpath/binaries.xml).
      - name: Stage binaries
        run: |
          T=x86_64-pc-windows-msvc
          mkdir -p stage
          cp "target/$T/release/atlas.exe" "target/$T/release/atlas-desktop.exe" stage/

      - name: Upload binaries
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-binaries
          path: stage/*
          if-no-files-found: error
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

  # The sign-* jobs: one SignPath request each, the same shape. Secrets and the SIGNPATH_ENABLED switch:
  # packaging/windows/signpath/README.md. The workflow only runs on a v* tag push or a dispatch by someone
  # with write access; SignPath's origin verification (repository, branch, workflow run) and the manual
  # approval of the signing policy are what gate the signature itself. The jobs get read-only tokens.
  sign-binaries:
    name: Sign binaries (SignPath)
    if: ${{ vars.SIGNPATH_ENABLED == 'true' && !inputs.build_only }}
    needs: windows-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 400
    permissions:
      contents: read
      actions: read
    steps:
      # SignPath's `version` parameter is the tag without the leading v (the version of the PE files).
      - name: Version
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ needs.windows-binaries.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
          wait-for-completion-timeout-in-seconds: "21600"
          output-artifact-directory: signed

      - name: Upload signed binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-binaries-signed
          path: signed/*
          if-no-files-found: error

  # The NSIS installer, packed from the (signed, when signing is on) binaries: `cargo tauri bundle` compiles
  # nothing and builds no frontend, it only packs what is in target/<triple>/release. The unsigned
  # path takes the binaries straight from windows-binaries, byte for byte what was built.
  windows-installer:
    name: Bundle installer (x86_64-pc-windows-msvc)
    needs: [windows-binaries, sign-binaries]
    if: ${{ !cancelled() && needs.windows-binaries.result == 'success' && (needs.sign-binaries.result == 'success' || needs.sign-binaries.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - uses: ./.github/actions/release-toolchain
        with:
          apt: nsis libayatana-appindicator3-dev
          targets: x86_64-pc-windows-msvc

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-binaries.result == 'success' && 'windows-binaries-signed' || 'windows-binaries' }}
          path: target/x86_64-pc-windows-msvc/release/

      # tauri.windows.conf.json picks the NSIS bundle (per-user install in %LOCALAPPDATA%\Atlas);
      # --config adds the CLI next to the app only here, so a plain `cargo build` never needs it.
      - name: Bundle installer
        run: |
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "$(scripts/setup.sh --tauri-version)" --locked
          (cd crates/atlas-desktop && cargo tauri bundle --ci \
            --target x86_64-pc-windows-msvc --bundles nsis \
            --config '{"bundle":{"resources":{"../../target/x86_64-pc-windows-msvc/release/atlas.exe":"atlas.exe"}}}')

      - name: Stage installer
        run: |
          mkdir -p stage
          cp target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe stage/

      - name: Upload installer
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: stage/*
          if-no-files-found: error
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

  sign-installer:
    name: Sign installer (SignPath)
    if: ${{ vars.SIGNPATH_ENABLED == 'true' && !inputs.build_only }}
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 400
    permissions:
      contents: read
      actions: read
    steps:
      - name: Version
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ needs.windows-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
          wait-for-completion-timeout-in-seconds: "21600"
          output-artifact-directory: signed

      - name: Upload signed installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-signed
          path: signed/*
          if-no-files-found: error

  # Atlas-Setup.exe (crates/atlas-setup): the one-click installer people download. It embeds the NSIS
  # installer (ATLAS_SETUP_PAYLOAD), signed when signing is on, and runs it silently behind its own
  # window. The NSIS installer stays a release asset too: `atlas desktop` and `atlas update` run it with /S.
  windows-setup:
    name: Build Atlas-Setup (x86_64-pc-windows-msvc)
    needs: [windows-installer, sign-installer]
    if: ${{ !cancelled() && needs.windows-installer.result == 'success' && (needs.sign-installer.result == 'success' || needs.sign-installer.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - uses: ./.github/actions/release-toolchain
        with:
          apt: clang lld llvm nasm
          targets: x86_64-pc-windows-msvc

      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-installer.result == 'success' && 'windows-installer-signed' || 'windows-installer' }}
          path: payload/

      - name: Build Atlas-Setup
        run: |
          command -v cargo-xwin >/dev/null || cargo install cargo-xwin --locked
          T=x86_64-pc-windows-msvc
          NSIS="$(ls "$PWD"/payload/*-setup.exe)"
          ATLAS_SETUP_PAYLOAD="$NSIS" cargo xwin build --release --locked --target "$T" -p atlas-setup

      - name: Stage Atlas-Setup
        run: |
          mkdir -p stage
          cp target/x86_64-pc-windows-msvc/release/Atlas-Setup.exe stage/

      - name: Upload Atlas-Setup
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup
          path: stage/*
          if-no-files-found: error
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

  sign-setup:
    name: Sign Atlas-Setup (SignPath)
    if: ${{ vars.SIGNPATH_ENABLED == 'true' && !inputs.build_only }}
    needs: windows-setup
    runs-on: ubuntu-latest
    timeout-minutes: 400
    permissions:
      contents: read
      actions: read
    steps:
      - name: Version
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ needs.windows-setup.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
          wait-for-completion-timeout-in-seconds: "21600"
          output-artifact-directory: signed

      - name: Upload signed Atlas-Setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup-signed
          path: signed/*
          if-no-files-found: error

  # The Windows assets `publish` collects, built from the final (signed when signing is on) bytes: the
  # archive, the renamed installer, Atlas-Setup.exe, and every checksum, taken after the last signature.
  # The job keeps the name build-windows, so publish's needs and the artifact name are unchanged.
  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    needs: [windows-binaries, sign-binaries, windows-installer, sign-installer, windows-setup, sign-setup]
    if: ${{ !cancelled() && needs.windows-binaries.result == 'success' && needs.windows-installer.result == 'success' && needs.windows-setup.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.sign-binaries.result) && contains(fromJSON('["success","skipped"]'), needs.sign-installer.result) && contains(fromJSON('["success","skipped"]'), needs.sign-setup.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-binaries.result == 'success' && 'windows-binaries-signed' || 'windows-binaries' }}
          path: in/binaries/

      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-installer.result == 'success' && 'windows-installer-signed' || 'windows-installer' }}
          path: in/installer/

      - name: Download Atlas-Setup
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-setup.result == 'success' && 'windows-setup-signed' || 'windows-setup' }}
          path: in/setup/

      - name: Package
        run: |
          V=${TAG#v}
          T=x86_64-pc-windows-msvc
          mkdir -p dist
          cp in/binaries/atlas.exe dist/
          (cd dist && tar czf "atlas-$V-$T.tar.gz" atlas.exe && rm atlas.exe)
          cp in/installer/*-setup.exe "dist/Atlas-$V-$T-setup.exe"
          cp in/setup/Atlas-Setup.exe dist/Atlas-Setup.exe
          cd dist
          for f in *.tar.gz *.exe; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-x86_64-pc-windows-msvc
          path: dist/*

  # Arch Linux: the .deb repackaged by makepkg (packaging/arch). Attached as a .pkg.tar.zst
  # (`sudo pacman -U`) together with the rendered PKGBUILD, which is what goes to the AUR.
  build-arch:
    name: Package (Arch Linux)
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git nodejs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-x86_64-unknown-linux-gnu
          path: linux/

      # makepkg refuses to run as root; the deb sits next to the PKGBUILD, so nothing is downloaded.
      - name: makepkg
        run: |
          V=${TAG#v}
          useradd -m builder
          mkdir -p /tmp/pkg dist
          cp "linux/atlas_${V}_amd64.deb" /tmp/pkg/
          packaging/arch/render.sh "$V" "/tmp/pkg/atlas_${V}_amd64.deb" > /tmp/pkg/PKGBUILD
          chown -R builder /tmp/pkg
          su builder -c 'cd /tmp/pkg && makepkg --nodeps --noconfirm'
          cp /tmp/pkg/*.pkg.tar.zst dist/
          cp /tmp/pkg/PKGBUILD dist/PKGBUILD
          cd dist
          for f in *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-x86_64-unknown-linux-gnu-arch
          path: dist/*

  # The Linux assets, executed before anything is published (#283, #312): in a fresh container of each distro the
  # package is installed with the distro's own tool, `atlas --version` and `atlas doctor` run, and then both the
  # AppImage and the package's atlas-desktop are opened on a private headless sway (Mesa llvmpipe) by
  # scripts/linux-launch-check.sh, which fails on a crash, a window that never maps, a blank page or an error in
  # the app's log. Any failure here blocks `publish`. Debian and Ubuntu share the .deb, Fedora takes the .rpm,
  # Arch the .pkg.tar.zst made from the .deb.
  verify-linux:
    name: Verify Linux (${{ matrix.name }})
    needs: [build-linux, build-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            slug: arch
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed git sway grim mesa dbus ttf-dejavu xorg-xwayland procps-ng && cp "$(command -v sway)" /usr/local/bin/sway
            install: pacman -U --noconfirm dist/*.pkg.tar.zst
          - name: Fedora
            slug: fedora
            image: fedora:latest
            setup: dnf install -y git sway grim mesa-dri-drivers dbus-daemon dejavu-sans-fonts xorg-x11-server-Xwayland procps-ng findutils && cp "$(command -v sway)" /usr/local/bin/sway
            install: dnf install -y dist/*.rpm
          - name: Ubuntu 24.04
            slug: ubuntu
            image: ubuntu:24.04
            setup: apt-get update && apt-get install -y --no-install-recommends ca-certificates git sway grim dbus libgl1-mesa-dri libegl1 xwayland fonts-dejavu-core procps
            install: apt-get install -y ./dist/*.deb
          - name: Debian stable
            slug: debian
            image: debian:stable
            setup: apt-get update && apt-get install -y --no-install-recommends ca-certificates git sway grim dbus libgl1-mesa-dri libegl1 xwayland fonts-dejavu-core procps
            install: apt-get install -y ./dist/*.deb
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Arch and Fedora ship sway with file capabilities (cap_sys_nice); a container without that capability cannot exec
      # it ("Operation not permitted"). A copy has no xattrs, so it runs, and /usr/local/bin comes first on PATH.
      - name: Tools and the headless display
        run: ${{ matrix.setup }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download the Linux assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: atlas-x86_64-unknown-linux-gnu*
          merge-multiple: true
          path: dist/

      # The package manager resolves the runtime libraries (WebKitGTK, GTK) the package declares: a missing
      # dependency fails here, not on a user's machine.
      - name: Install the package
        run: |
          ls -l dist
          ${{ matrix.install }}

      # The package declares GStreamer's plugins (#265): without them a page that loads an <audio> or <video> aborts
      # its web process. Ogg (plugins-base) is the one every sound and media file needs.
      - name: The package brought GStreamer's plugins
        run: find /usr/lib /usr/lib64 -name libgstogg.so 2>/dev/null | grep . || { echo "no GStreamer plugins after the install" >&2; exit 1; }

      - name: atlas --version and atlas doctor
        run: |
          atlas --version
          if [ "${{ inputs.build_only }}" != true ]; then atlas --version | grep -F "${TAG#v}"; fi
          command -v atlas-desktop
          atlas doctor --json | tee doctor.json

      # A container has no user namespaces for WebKitGTK's own sandbox (bubblewrap); without the variable the web
      # process aborts at start whatever the build is. Everything else is what a user gets.
      - name: Open the AppImage
        run: |
          APPIMAGE=$(ls dist/Atlas-*.AppImage)
          chmod +x "$APPIMAGE"
          scripts/linux-launch-check.sh --out check/appimage --env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            --env ATLAS_BIN="$(command -v atlas)" "$APPIMAGE"

      - name: Open the installed atlas-desktop
        run: |
          scripts/linux-launch-check.sh --out check/package --env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 "$(command -v atlas-desktop)"

      - name: Screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-linux-${{ matrix.slug }}
          path: |
            check/
            doctor.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish Release
    needs: [build, build-linux, build-linux-arm64, build-arch, build-windows, verify-linux]
    # Explicit: without an `if`, a skipped job anywhere upstream (the optional SignPath jobs feeding build-windows)
    # skips publish too, and v1.5.0-alpha.25's first full run built everything and published nothing.
    if: ${{ !cancelled() && !inputs.build_only && needs.build.result == 'success' && needs.verify-linux.result == 'success' && needs.build-linux.result == 'success' && needs.build-linux-arm64.result == 'success' && needs.build-arch.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # the only job that may create the release
      pull-requests: read   # scripts/release-contributors.ts reads each commit's PR author and reviewers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # prerelease / make_latest come from the tag's channel against the default channel
      # (crates/atlas-core/data/channels.json): a build of the default channel is a normal, "Latest" release.
      - name: GitHub release flags
        id: flags
        run: bun scripts/release-version.ts github-flags --tag "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      # The Arch package belongs with the rest of the Linux assets (one platform in manifest.json).
      - name: Merge Linux artifacts
        run: |
          if [ -d artifacts/atlas-x86_64-unknown-linux-gnu-arch ]; then
            mv artifacts/atlas-x86_64-unknown-linux-gnu-arch/* artifacts/atlas-x86_64-unknown-linux-gnu/
            rmdir artifacts/atlas-x86_64-unknown-linux-gnu-arch
          fi

      - name: Promotion source
        id: promoted
        run: |
          git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          echo "from=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed -n 's/^Promoted from: //p' | head -1)" >> "$GITHUB_OUTPUT"

      # promoted_from comes from the tag message ("Promoted from: …", written by release.sh stable).
      - name: Generate manifest
        env:
          ATLAS_PROMOTED_FROM: ${{ steps.promoted.outputs.from }}
        run: |
          ATLAS_VERSION=${TAG#v}
          python3 scripts/generate-manifest.py "$ATLAS_VERSION" artifacts/ > manifest.json

      # One checksum file over every asset (the per-file .sha256 files stay for `atlas update`).
      - name: SHA256SUMS
        run: |
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.dmg' -o -name '*.cdx.json' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name 'PKGBUILD' -o -name '*-setup.exe' -o -name 'Atlas-Setup.exe' \) -print0 \
            | xargs -0 shasum -a 256 | sed 's#  .*/#  #' | sort -k2 > SHA256SUMS
          shasum -a 256 manifest.json >> SHA256SUMS
          cat SHA256SUMS

      # The release body: this version's CHANGELOG.md section, who worked on it, then install/update steps, within
      # GitHub's size cap (scripts/release-notes.ts shortens a section that would not fit; 1.5.0-alpha.26's was cut
      # mid-entry). scripts/release-contributors.ts fails the step if a commit identity maps to nobody.
      - name: Release notes
        env:
          MAKE_LATEST: ${{ steps.flags.outputs.make_latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${TAG#v}
          case "$V" in
            *-alpha.*) CH="an **alpha** build, cut straight from main with little soak. Expect rough edges and breaking changes." ;;
            *-beta.*) CH="a **beta** build: feature-complete and being soaked before it becomes Stable. A bug can slip through." ;;
            *-rc.*) CH="a **release-candidate** build: the next Stable, being soaked. Only the version number should change when it is promoted." ;;
            *) CH="" ;;
          esac
          : > header.md
          if [ -n "$CH" ]; then
            # GitHub's "Latest" badge follows the default channel (alpha pre-GA), which is not the Stable channel.
            if [ "$MAKE_LATEST" = true ]; then
              printf '> This is %s GitHub marks it "Latest" because it is what the default update channel offers while Atlas is in alpha; it is not offered on the Stable channel; see [versioning](https://atlas.codeatlas.com.br/docs/versioning).\n\n' "$CH" >> header.md
            else
              printf '> This is %s It is not offered on the Stable channel; see [versioning](https://atlas.codeatlas.com.br/docs/versioning).\n\n' "$CH" >> header.md
            fi
          fi
          bun scripts/release-contributors.ts "$V" "$TAG" > footer.md
          cat >> footer.md <<'EOF'

          ## Install

          ```bash
          curl -fsSL https://atlas.codeatlas.com.br/install.sh | bash
          ```

          Windows (PowerShell):

          ```powershell
          irm https://atlas.codeatlas.com.br/install.ps1 | iex
          ```

          Or download `atlas-*-aarch64-apple-darwin.tar.gz` (macOS), `atlas-*-x86_64-unknown-linux-gnu.tar.gz`
          or `atlas-*-aarch64-unknown-linux-gnu.tar.gz` (Linux) or `atlas-*-x86_64-pc-windows-msvc.tar.gz` (Windows)
          below, verify it against its `.sha256` (or `SHA256SUMS`), extract it and run `./atlas install`.

          ## Desktop app

          ```bash
          atlas desktop   # installs Atlas Desktop on first run (macOS: /Applications; Linux: ~/.local/bin; Windows: %LOCALAPPDATA%\Atlas), then opens it
          ```

          Or download a package below:

          | | |
          |---|---|
          | macOS | `Atlas-*-aarch64-apple-darwin.dmg` |
          | Windows 10/11 | `Atlas-Setup.exe` (one click, per-user, no admin rights; carries `atlas.exe` too). `Atlas-*-x86_64-pc-windows-msvc-setup.exe` is the plain NSIS installer behind it (`/S` for scripts) |
          | Arch Linux | `codeatlas-atlas-bin-*-x86_64.pkg.tar.zst`: `sudo pacman -U codeatlas-atlas-bin-*.pkg.tar.zst` |
          | Debian, Ubuntu | `atlas_*_amd64.deb`: `sudo apt install ./atlas_*_amd64.deb` |
          | Fedora, openSUSE | `atlas-*.x86_64.rpm`: `sudo dnf install ./atlas-*.x86_64.rpm` |
          | Any Linux | `Atlas-*-x86_64-unknown-linux-gnu.AppImage`: `chmod +x` and run it |

          The Linux packages install both `atlas` and `atlas-desktop` in `/usr/bin`.

          ## Update

          ```bash
          atlas update    # updates the CLI and an installed Atlas.app together
          ```
          EOF
          bun scripts/release-notes.ts "$V" header.md footer.md > notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          name: Atlas ${{ env.TAG }}
          body_path: notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.pkg.tar.zst
            artifacts/**/PKGBUILD
            artifacts/**/*-setup.exe
            artifacts/**/Atlas-Setup.exe
            artifacts/**/*.sha256
            artifacts/**/*.cdx.json
            manifest.json
            SHA256SUMS
          draft: false
          # A build of the default channel (alpha pre-GA) is a normal release and "Latest"; anything more adventurous is a
          # prerelease. Stable clients never trust /releases/latest: they read the feed (docs/versioning.md).
          prerelease: ${{ steps.flags.outputs.prerelease }}
          make_latest: ${{ steps.flags.outputs.make_latest }}
