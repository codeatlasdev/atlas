name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test -p atlas-tui -p atlas-cli -p atlas-core

      - name: Clippy
        run: cargo clippy -p atlas-tui -p atlas-cli -p atlas-core -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p atlas-cli

      - name: Package
        run: |
          ATLAS_VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/atlas dist/
          chmod +x dist/atlas
          cd dist
          tar czf atlas-${ATLAS_VERSION}-${{ matrix.target }}.tar.gz atlas
          shasum -a 256 atlas-${ATLAS_VERSION}-${{ matrix.target }}.tar.gz > atlas-${ATLAS_VERSION}-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.target }}
          path: dist/*.tar.gz*

  universal:
    name: Universal Binary (macOS)
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: atlas-aarch64-apple-darwin
          path: arm64/

      - name: Download x86_64
        uses: actions/download-artifact@v4
        with:
          name: atlas-x86_64-apple-darwin
          path: x86_64/

      - name: Create universal binary
        run: |
          ATLAS_VERSION=${GITHUB_REF_NAME#v}
          mkdir -p universal

          cd arm64 && tar xzf *.tar.gz && cd ..
          cd x86_64 && tar xzf *.tar.gz && cd ..

          lipo -create arm64/atlas x86_64/atlas -output universal/atlas
          chmod +x universal/atlas

          cd universal
          tar czf atlas-${ATLAS_VERSION}-universal-apple-darwin.tar.gz atlas
          shasum -a 256 atlas-${ATLAS_VERSION}-universal-apple-darwin.tar.gz > atlas-${ATLAS_VERSION}-universal-apple-darwin.tar.gz.sha256

      - name: Upload universal
        uses: actions/upload-artifact@v4
        with:
          name: atlas-universal-apple-darwin
          path: universal/*.tar.gz*

  publish:
    name: Publish Release
    needs: [build, universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate manifest
        run: |
          ATLAS_VERSION=${GITHUB_REF_NAME#v}
          python3 scripts/generate-manifest.py "$ATLAS_VERSION" artifacts/ > manifest.json
          cat manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Atlas ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            # macOS (Homebrew)
            brew tap codeatlasdev/tap && brew install atlas

            # Shell installer
            curl -fsSL https://atlas.codeatlas.com.br/install.sh | sh

            # Self-update (if already installed)
            atlas self-update
            ```

            ## What's Changed

            See auto-generated changelog below.
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
            manifest.json
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

  homebrew:
    name: Update Homebrew
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: atlas
          homebrew-tap: codeatlasdev/homebrew-tap
          download-url: https://github.com/codeatlasdev/atlas/releases/download/${{ github.ref_name }}/atlas-${{ steps.version.outputs.number }}-universal-apple-darwin.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
