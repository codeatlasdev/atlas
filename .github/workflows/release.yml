name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

# Runs on GitHub-hosted runners when a v* tag is pushed (`bun run release` pushes it), or by hand for an
# existing tag (`bun run release --publish vX.Y.Z`, which dispatches this workflow from main with `tag`).
# Publishes only after the CI run of the tagged commit passed (scripts/ci-passed.sh).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (vX.Y.Z[-pre.N])
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/ci-passed.sh "$REPO" "$(git rev-parse HEAD)"

  build:
    name: Build (aarch64-apple-darwin)
    needs: gate
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      # SOURCE_DATE_EPOCH = the commit time, so embedded timestamps do not depend on when the build ran.
      # No --remap-path-prefix: not verified against the Tauri build in this repo.
      - name: Build
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          cargo build --release --locked --target aarch64-apple-darwin -p atlas-cli

      # CycloneDX SBOM of the CLI's dependency tree (the shipped binary). Skipped, loudly, when the tool is missing.
      - name: SBOM
        run: |
          ATLAS_VERSION=${TAG#v}
          mkdir -p dist
          if command -v cargo-cyclonedx >/dev/null || cargo install cargo-cyclonedx --locked; then
            cargo cyclonedx --manifest-path crates/atlas-cli/Cargo.toml --format json \
              --target aarch64-apple-darwin --override-filename atlas-cli-sbom
            # cargo-cyclonedx writes one file per workspace member; keep the CLI's, drop the rest.
            mv crates/atlas-cli/atlas-cli-sbom.json "dist/atlas-${ATLAS_VERSION}-sbom.cdx.json"
            rm -f crates/*/atlas-cli-sbom.json
          else
            echo "::warning::cargo-cyclonedx is not available: this release has no SBOM"
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Build desktop app
        run: |
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "$(scripts/setup.sh --tauri-version)" --locked
          (cd apps/desktop && bun install --frozen-lockfile)
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          (cd crates/atlas-desktop && cargo tauri build --target aarch64-apple-darwin --bundles app,dmg --ci)

      - name: Package
        run: |
          ATLAS_VERSION=${TAG#v}
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/atlas dist/
          chmod +x dist/atlas
          # Ad-hoc sign so macOS Gatekeeper doesn't SIGKILL on first run
          codesign --sign - --force --preserve-metadata=entitlements,requirements,flags dist/atlas
          cd dist
          tar czf "atlas-${ATLAS_VERSION}-aarch64-apple-darwin.tar.gz" atlas
          shasum -a 256 "atlas-${ATLAS_VERSION}-aarch64-apple-darwin.tar.gz" > "atlas-${ATLAS_VERSION}-aarch64-apple-darwin.tar.gz.sha256"
          # Atlas Desktop: the .app tarball is what `atlas desktop` / `atlas update` install;
          # the .dmg is for people who download it by hand.
          BUNDLE=../target/aarch64-apple-darwin/release/bundle
          APP=Atlas-${ATLAS_VERSION}-aarch64-apple-darwin
          tar czf "${APP}.app.tar.gz" -C "${BUNDLE}/macos" Atlas.app
          cp "${BUNDLE}"/dmg/Atlas_*_aarch64.dmg "${APP}.dmg"
          shasum -a 256 "${APP}.app.tar.gz" > "${APP}.app.tar.gz.sha256"
          shasum -a 256 "${APP}.dmg" > "${APP}.dmg.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-aarch64-apple-darwin
          path: |
            dist/*.tar.gz*
            dist/*.dmg*
            dist/*.cdx.json

  # Linux x86_64: the CLI tarball, and Atlas Desktop as AppImage (what `atlas desktop` installs),
  # .deb and .rpm (both also carry the CLI as /usr/bin/atlas). Built on the oldest supported
  # Ubuntu so the binaries run on any glibc >= 2.35 (Arch, Fedora, Debian 12, Ubuntu 22.04+).
  build-linux:
    name: Build (x86_64-unknown-linux-gnu)
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: System libraries
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends build-essential curl file pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust
        run: |
          command -v rustup >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Build CLI
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          cargo build --release --locked -p atlas-cli

      # tauri.linux.conf.json picks the deb/rpm/appimage bundles and puts target/release/atlas in the packages.
      # linuxdeploy (and its plugins) are AppImages; APPIMAGE_EXTRACT_AND_RUN unpacks them instead of mounting through FUSE, which the runner does not provide.
      - name: Build desktop app
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "$(scripts/setup.sh --tauri-version)" --locked
          (cd apps/desktop && bun install --frozen-lockfile)
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          (cd crates/atlas-desktop && cargo tauri build --ci)

      - name: Package
        run: |
          V=${TAG#v}
          T=x86_64-unknown-linux-gnu
          B=target/release/bundle
          mkdir -p dist
          cp target/release/atlas dist/
          (cd dist && tar czf "atlas-$V-$T.tar.gz" atlas && rm atlas)
          cp "$B"/appimage/*.AppImage "dist/Atlas-$V-$T.AppImage"
          cp "$B"/deb/*.deb "dist/atlas_${V}_amd64.deb"
          cp "$B"/rpm/*.rpm "dist/atlas-$V-1.x86_64.rpm"
          cd dist
          for f in *.tar.gz *.AppImage *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-x86_64-unknown-linux-gnu
          path: dist/*

  # Arch Linux: the .deb repackaged by makepkg (packaging/arch). Attached as a .pkg.tar.zst
  # (`sudo pacman -U`) together with the rendered PKGBUILD, which is what goes to the AUR.
  build-arch:
    name: Package (Arch Linux)
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git nodejs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Download Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-x86_64-unknown-linux-gnu
          path: linux/

      # makepkg refuses to run as root; the deb sits next to the PKGBUILD, so nothing is downloaded.
      - name: makepkg
        run: |
          V=${TAG#v}
          useradd -m builder
          mkdir -p /tmp/pkg dist
          cp "linux/atlas_${V}_amd64.deb" /tmp/pkg/
          packaging/arch/render.sh "$V" "/tmp/pkg/atlas_${V}_amd64.deb" > /tmp/pkg/PKGBUILD
          chown -R builder /tmp/pkg
          su builder -c 'cd /tmp/pkg && makepkg --nodeps --noconfirm'
          cp /tmp/pkg/*.pkg.tar.zst dist/
          cp /tmp/pkg/PKGBUILD dist/PKGBUILD
          cd dist
          for f in *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-x86_64-unknown-linux-gnu-arch
          path: dist/*

  publish:
    name: Publish Release
    needs: [build, build-linux, build-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # the only job that may create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # prerelease / make_latest come from the tag's channel against the default channel
      # (crates/atlas-core/data/channels.json): a build of the default channel is a normal, "Latest" release.
      - name: GitHub release flags
        id: flags
        run: bun scripts/release-version.ts github-flags --tag "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      # The Arch package belongs with the rest of the Linux assets (one platform in manifest.json).
      - name: Merge Linux artifacts
        run: |
          if [ -d artifacts/atlas-x86_64-unknown-linux-gnu-arch ]; then
            mv artifacts/atlas-x86_64-unknown-linux-gnu-arch/* artifacts/atlas-x86_64-unknown-linux-gnu/
            rmdir artifacts/atlas-x86_64-unknown-linux-gnu-arch
          fi

      - name: Promotion source
        id: promoted
        run: |
          git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          echo "from=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed -n 's/^Promoted from: //p' | head -1)" >> "$GITHUB_OUTPUT"

      # promoted_from comes from the tag message ("Promoted from: …", written by release.sh stable).
      - name: Generate manifest
        env:
          ATLAS_PROMOTED_FROM: ${{ steps.promoted.outputs.from }}
        run: |
          ATLAS_VERSION=${TAG#v}
          python3 scripts/generate-manifest.py "$ATLAS_VERSION" artifacts/ > manifest.json

      # One checksum file over every asset (the per-file .sha256 files stay for `atlas update`).
      - name: SHA256SUMS
        run: |
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.dmg' -o -name '*.cdx.json' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name 'PKGBUILD' \) -print0 \
            | xargs -0 shasum -a 256 | sed 's#  .*/#  #' | sort -k2 > SHA256SUMS
          shasum -a 256 manifest.json >> SHA256SUMS
          cat SHA256SUMS

      # The release body: this version's CHANGELOG.md section, then install/update steps.
      - name: Release notes
        env:
          MAKE_LATEST: ${{ steps.flags.outputs.make_latest }}
        run: |
          V=${TAG#v}
          case "$V" in
            *-alpha.*) CH="an **alpha** build, cut straight from main with little soak. Expect rough edges and breaking changes." ;;
            *-beta.*) CH="a **beta** build: feature-complete and being soaked before it becomes Stable. A bug can slip through." ;;
            *-rc.*) CH="a **release-candidate** build: the next Stable, being soaked. Only the version number should change when it is promoted." ;;
            *) CH="" ;;
          esac
          : > notes.md
          if [ -n "$CH" ]; then
            # GitHub's "Latest" badge follows the default channel (alpha pre-GA), which is not the Stable channel.
            if [ "$MAKE_LATEST" = true ]; then
              printf '> This is %s GitHub marks it "Latest" because it is what the default update channel offers while Atlas is in alpha; it is not offered on the Stable channel; see [versioning](https://atlas.codeatlas.com.br/docs/versioning).\n\n' "$CH" >> notes.md
            else
              printf '> This is %s It is not offered on the Stable channel; see [versioning](https://atlas.codeatlas.com.br/docs/versioning).\n\n' "$CH" >> notes.md
            fi
          fi
          awk -v v="$V" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md >> notes.md
          cat >> notes.md <<'EOF'

          ## Install

          ```bash
          curl -fsSL https://atlas.codeatlas.com.br/install.sh | bash
          ```

          Or download `atlas-*-aarch64-apple-darwin.tar.gz` (macOS) or `atlas-*-x86_64-unknown-linux-gnu.tar.gz`
          (Linux) below, verify it against its `.sha256` (or `SHA256SUMS`), extract it and run `./atlas install`.

          ## Desktop app

          ```bash
          atlas desktop   # installs Atlas Desktop on first run (macOS: /Applications; Linux: ~/.local/bin), then opens it
          ```

          Or download a package below:

          | | |
          |---|---|
          | macOS | `Atlas-*-aarch64-apple-darwin.dmg` |
          | Arch Linux | `codeatlas-atlas-bin-*-x86_64.pkg.tar.zst`: `sudo pacman -U codeatlas-atlas-bin-*.pkg.tar.zst` |
          | Debian, Ubuntu | `atlas_*_amd64.deb`: `sudo apt install ./atlas_*_amd64.deb` |
          | Fedora, openSUSE | `atlas-*.x86_64.rpm`: `sudo dnf install ./atlas-*.x86_64.rpm` |
          | Any Linux | `Atlas-*-x86_64-unknown-linux-gnu.AppImage`: `chmod +x` and run it |

          The Linux packages install both `atlas` and `atlas-desktop` in `/usr/bin`.

          ## Update

          ```bash
          atlas update    # updates the CLI and an installed Atlas.app together
          ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Atlas ${{ env.TAG }}
          body_path: notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.pkg.tar.zst
            artifacts/**/PKGBUILD
            artifacts/**/*.sha256
            artifacts/**/*.cdx.json
            manifest.json
            SHA256SUMS
          draft: false
          # A build of the default channel (alpha pre-GA) is a normal release and "Latest"; anything more adventurous is a
          # prerelease. Stable clients never trust /releases/latest: they read the feed (docs/versioning.md).
          prerelease: ${{ steps.flags.outputs.prerelease }}
          make_latest: ${{ steps.flags.outputs.make_latest }}
