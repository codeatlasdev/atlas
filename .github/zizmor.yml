# zizmor (https://docs.zizmor.sh) configuration: run by scripts/lint-workflows.sh. Every ignore names
# its reason; fix a finding instead of adding a line here whenever the fix is possible.
rules:
  # `uses: ./.github/actions/...` is GitHub's documented local-action syntax; keep it.
  self-repository:
    disable: true
  # The publish step stays one pinned action call (softprops/action-gh-release); a hand-written gh script would be more code to audit.
  superfluous-actions:
    ignore:
      - release.yml
  # The point of `verify-linux` is to install the release on what users run today: archlinux:latest and fedora:latest are
  # rolling distros with no stable tag to pin, and a pinned old image would test a world nobody has. The job builds nothing
  # and publishes nothing (its output is screenshots and logs).
  unpinned-images:
    ignore:
      - release.yml
  # `desktop-linux` restores the main-branch cargo cache (never saved from a pull request, same rule as rust-gate) and uploads
  # a screenshot and logs. The artifact is read by people, never executed or published.
  cache-poisoning:
    ignore:
      - ci.yml:148
  # `ci-rerun-lost.yml` reacts to a finished CI run to rerun it when its runner was lost (issue #520). It checks out the
  # default branch only, never the pull request, passes the event's values through `env:` to a script that validates them,
  # and its token is `actions: write` + `checks: read` + `contents: read`: it can rerun a run and read annotations.
  dangerous-triggers:
    ignore:
      - ci-rerun-lost.yml
