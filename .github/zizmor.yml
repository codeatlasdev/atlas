# zizmor (https://docs.zizmor.sh) configuration: run by scripts/lint-workflows.sh. Every ignore names
# its reason; fix a finding instead of adding a line here whenever the fix is possible.
rules:
  # `uses: ./.github/actions/...` is GitHub's documented local-action syntax; keep it.
  self-repository:
    disable: true
  # The publish step stays one pinned action call (softprops/action-gh-release); a hand-written gh script would be more code to audit.
  superfluous-actions:
    ignore:
      - release.yml
