[workspace]
resolver = "3"
members = [
    "crates/atlas-core",
    "crates/atlas-tui",
    "crates/atlas-cli",
    "crates/atlas-skills",
    "crates/atlas-desktop",
    "crates/atlas-host",
    "crates/atlas-lsp",
    "crates/atlas-term",
]
# `cargo build|test` without `--workspace` skips the GUI crates (Tauri/WebKit, the Metal terminal), so the CLI,
# TUI, runtime and MCP server build anywhere without system GUI libraries. CI and `bun run check` pass
# `--workspace` (on Linux that needs WebKitGTK: see docs/installation.md, "Build from source").
default-members = [
    "crates/atlas-core",
    "crates/atlas-tui",
    "crates/atlas-cli",
    "crates/atlas-skills",
    "crates/atlas-host",
    "crates/atlas-lsp",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeatlasdev/atlas"
homepage = "https://atlas.codeatlas.com.br"
authors = ["CodeAtlas"]
keywords = ["dev-environment", "terminal", "tui", "process-manager", "ai-agents"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
semver = "1.0"
dirs = "7"
tempfile = "3.27"
crossterm = "0.29"
libc = "0.2"
base64 = "0.23"
parking_lot = "0.12"
notify = "8"
flate2 = "1.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"

# Build profiles. Rationale and measurements: docs/build-perf.md.
[profile.dev]
# Backtraces keep file:line; variable/type debug info is dropped (uv measured -20 % on a warm
# edit/build/test loop on Apple silicon). Need lldb with variables? `cargo build --profile debug`.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies: no debug info at all (the bulk of target/ and of link input).
debug = false

[profile.dev.build-override]
# Build scripts and proc-macros (host artifacts): same, or Cargo builds the shared deps twice.
debug = false

[profile.debug]
# Full debug info for a debugger session. Opt-in only.
inherits = "dev"
debug = "full"

