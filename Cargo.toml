[workspace]
resolver = "3"
members = [
    "crates/atlas-core",
    "crates/atlas-db",
    "crates/atlas-ssh",
    "crates/atlas-ai",
    "crates/atlas-server",
    "crates/atlas-daemon",
    "crates/atlas-cli",
    "crates/atlas-terminal",
    "crates/atlas-agent",
    "crates/atlas-plugin",
    "crates/atlas-agent-kiro",
]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
russh = "0.52"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
portable-pty = "0.9"
toml = "0.8"
serde_yaml = "0.9"
which = "7"
