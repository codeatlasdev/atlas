[workspace]
resolver = "3"
members = [
    "crates/atlas-core",
    "crates/atlas-tui",
    "crates/atlas-cli",
    "crates/atlas-skills",
    "crates/atlas-desktop",
    "crates/atlas-host",
    "crates/atlas-term",
]
# `cargo build|test` without `--workspace` skips the macOS-only GUI crates (Tauri/WebKit, Metal),
# so the CLI, TUI, runtime and MCP server build and test on Linux. CI and `bun run check` pass `--workspace`.
default-members = [
    "crates/atlas-core",
    "crates/atlas-tui",
    "crates/atlas-cli",
    "crates/atlas-skills",
    "crates/atlas-host",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeatlasdev/atlas"
homepage = "https://atlas.codeatlas.com.br"
authors = ["CodeAtlas"]
keywords = ["dev-environment", "terminal", "tui", "process-manager", "ai-agents"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.13", features = ["json", "form"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
semver = "1.0"
dirs = "7"
tempfile = "3.27"
crossterm = "0.29"
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"

