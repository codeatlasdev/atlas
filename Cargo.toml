[workspace]
resolver = "3"
members = [
    "crates/atlas-core",
    "crates/atlas-tui",
    "crates/atlas-cli",
    "crates/atlas-skills",
    "crates/atlas-desktop",
    "crates/atlas-host",
    "crates/atlas-lsp",
    "crates/atlas-term",
    "crates/atlas-setup",
    "crates/atlas-i18n",
]
# `cargo build|test` without `--workspace` skips the GUI crates (Tauri/WebKit, the Metal terminal), so the CLI,
# TUI, runtime and MCP server build anywhere without system GUI libraries. CI and `bun run check` pass
# `--workspace` (on Linux that needs WebKitGTK: see docs/installation.md, "Build from source").
default-members = [
    "crates/atlas-core",
    "crates/atlas-tui",
    "crates/atlas-cli",
    "crates/atlas-skills",
    "crates/atlas-host",
    "crates/atlas-lsp",
    "crates/atlas-i18n",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeatlasdev/atlas"
homepage = "https://atlas.codeatlas.com.br"
authors = ["CodeAtlas"]
keywords = ["dev-environment", "terminal", "tui", "process-manager", "ai-agents"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
clap = { version = "4.6", features = ["derive", "string"] }
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
# Dates, times and time zones (replaces chrono + chrono-tz, unmaintained: RUSTSEC-2026-0543/0555, #540). croner 4 reads
# jiff 0.2 (its `jiff` feature), so this stays on 0.2 until croner moves to jiff 1. `jiff-tzdb` is the zone database
# bundled in the binary, which `atlas_core::time::zone` reads: like chrono-tz, a named zone does not depend on the
# machine's tzdata (a Ubuntu 24.04 server has none of `US/Pacific`, `EST5EDT`, `Zulu` without `tzdata-legacy`).
jiff = "0.2"
jiff-tzdb = "1.0"
semver = "1.0"
dirs = "7"
tempfile = "3.27"
crossterm = "0.29"
libc = "0.2"
base64 = "0.23"
parking_lot = "0.13"
notify = "8"
flate2 = "1.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"

# Build profiles. Rationale and measurements: docs/build-perf.md.
[profile.dev]
# Backtraces keep file:line; variable/type debug info is dropped (uv measured -20 % on a warm
# edit/build/test loop on Apple silicon). Need lldb with variables? `cargo build --profile debug`.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies: no debug info at all (the bulk of target/ and of link input).
debug = false

[profile.dev.build-override]
# Build scripts and proc-macros (host artifacts): same, or Cargo builds the shared deps twice.
debug = false

[profile.debug]
# Full debug info for a debugger session. Opt-in only.
inherits = "dev"
debug = "full"


[profile.release]
# File and line in release backtraces and a debug file to publish per release (#318): crash reports carry raw
# addresses plus the build id, and `scripts/symbols.sh` resolves them against the symbols extracted from the shipped
# binary (docs/release.md, "Symbols"). Line tables only: no variable or type info, a fraction of `debug = "full"`.
debug = "line-tables-only"
