[workspace]
resolver = "3"
members = [
    "crates/atlas-core",
    "crates/atlas-tui",
    "crates/atlas-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
semver = "1.0"
