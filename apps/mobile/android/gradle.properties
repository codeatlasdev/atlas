# 8 GB heap is Flutter's template default; the metaspace and heap-dump flags keep Gradle's own daemon from
# vanishing on an OOM (https://github.com/gradle/gradle/issues/19750).
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Independent tasks (the per-ABI Rust builds, dexing, resources) run side by side.
org.gradle.parallel=true
# A task whose inputs did not change is restored from ~/.gradle instead of rerun (flavor switches, CI).
org.gradle.caching=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
