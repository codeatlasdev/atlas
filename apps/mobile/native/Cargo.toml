[package]
name = "atlas_mobile_native"
version = "0.1.0"
edition = "2021"
description = "iroh P2P transport for Atlas Mobile (flutter_rust_bridge 2.x)"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
iroh = "1.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hex = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
