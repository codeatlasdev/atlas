[package]
name = "atlas-cli"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
readme = "../../README.md"
description = "Atlas, the developer platform for everyone: one atlas.yaml runs your stack from the `atlas` CLI, TUI and MCP server"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
crossterm = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
chrono = { workspace = true }
sha2 = "0.11"
hex = "0.4"
self-replace = "1.5"
flate2 = "1.1"
tar = "0.4"
atlas-tui = { path = "../atlas-tui" }
atlas-core = { path = "../atlas-core" }
atlas-skills = { path = "../atlas-skills" }
atlas-host = { path = "../atlas-host" }
base64 = "0.23"
dirs = { workspace = true }
tempfile = { workspace = true }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }

[lints]
workspace = true
