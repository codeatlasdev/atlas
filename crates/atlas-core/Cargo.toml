[package]
name = "atlas-core"
version = "1.5.0-alpha.27"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
readme = "../../README.md"
description = "Shared types, paths, config and GitHub release helpers for Atlas"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
semver = { workspace = true }
# Release signature verification (release_verify.rs): ring is already in the tree for TLS.
base64 = { workspace = true }
ring = "0.17"
tokio = { workspace = true }
sha2 = "0.11"
hex = "0.4"
sys-locale = "0.3"
# .gitignore-aware walking and glob matching: the task cache expands `inputs:` globs with it.
ignore = "0.4"
# `Include` globs of ~/.ssh/config (`ssh_config.rs`): already in the tree through `ignore`.
globset = "0.4"
tempfile = { workspace = true, optional = true }
jiff = { workspace = true }
jiff-tzdb = { workspace = true }

[features]
# Fixtures for tests in dependent crates (`login_env::fixtures`, `scaling`).
test-fixtures = ["dep:tempfile"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    # ShellExecuteW takes a SHOW_WINDOW_CMD: without this the function is not generated, and atlas-core built alone
    # (`-p atlas-core`) does not compile on Windows; a workspace build only got it from another crate's features.
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
