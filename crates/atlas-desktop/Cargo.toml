[package]
name = "atlas-desktop"
version = "1.5.0-alpha.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
readme = "../../README.md"
description = "Atlas Desktop: Tauri shell with GPU terminal, worktrees, browser and agent panels"

[[bin]]
name = "atlas-desktop"
path = "src/main.rs"

[package.metadata.cargo-machete]
# used by build.rs (machete does not scan build scripts)
ignored = ["tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
window-vibrancy = "0.8"
atlas-tui = { path = "../atlas-tui" }
atlas-core = { path = "../atlas-core" }
atlas-host = { path = "../atlas-host" }
base64 = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
sha1_smol = "1"
notify = { workspace = true }
parking_lot = { workspace = true }
libc = { workspace = true }
semver = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSView", "NSResponder", "NSWindow", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSEvent", "NSHapticFeedback", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSError", "NSURL", "NSArray", "NSDictionary", "NSProcessInfo", "NSData", "NSObject", "NSValue", "NSRunLoop", "NSDate"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "SCStream", "SCShareableContent", "SCScreenshotManager", "SCRecordingOutput", "SCError", "objc2-core-media", "objc2-core-graphics", "objc2-av-foundation"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMSync", "objc2-core-video"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow", "CGImage"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVMediaFormat", "AVVideoSettings"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebView", "WKSnapshotConfiguration"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CADisplayLink", "CALayer", "CATransaction", "CAAnimation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
dispatch2 = "0.3"
atlas-term = { path = "../atlas-term" }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the graph through wry/gtk (same 0.18 line); used to ask the session bus whether a StatusNotifier host
# exists (tray.rs), because a tray icon with no host is silently invisible.
gio = "0.18"

[dev-dependencies]
serde_norway = { workspace = true }

[lints]
workspace = true
