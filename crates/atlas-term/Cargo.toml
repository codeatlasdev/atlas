[package]
name = "atlas-term"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
readme = "../../README.md"
description = "GPU terminal renderer (wgpu + alacritty_terminal) for Atlas Desktop"

[dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl", "std"] }
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1.0"
alacritty_terminal = "0.26"
parking_lot = "0.12"
swash = "0.2"
base64 = "0.23"
flate2 = "1.1"
png = "0.18"

[lints]
workspace = true
