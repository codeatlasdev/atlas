[package]
name = "atlas-tui"
version = "1.5.0-alpha.14"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
readme = "../../README.md"
description = "Atlas runtime: service manager, TUI, MCP server and runner"

[lib]
name = "atlas_tui"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

ratatui = "0.30"
unicode-width = "0.2"
crossterm = { workspace = true, features = ["event-stream", "bracketed-paste"] }
futures-util = "0.3"
atlas-core = { path = "../atlas-core" }
dirs = { workspace = true }
regex = "1"
schemars = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
atlas-core = { path = "../atlas-core", features = ["test-fixtures"] }

[lints]
workspace = true
