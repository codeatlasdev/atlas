[advisories]
version = 2
# Unmaintained-crate notices for transitive deps pulled in by Tauri and iroh; we
# cannot upgrade them ourselves. Re-evaluate when bumping tauri or iroh.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros (tauri -> tray-icon -> gtk, Linux-only); no fix available upstream" },
    { id = "RUSTSEC-2024-0436", reason = "paste via netlink-packet-core (iroh -> netwatch); no safe upgrade, cannot change iroh's transitive deps" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 (tauri-plugin-notification -> notify-rust, Linux-only); unmaintained notice, no newer notify-rust on zbus 6 yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 (tauri-plugin-notification -> notify-rust, Linux-only); same as above" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 (tauri-plugin-notification -> notify-rust, Linux-only); same as above" },
    # Direct dependencies, unlike the ones above: removed by migrating to jiff (#540), which deletes these two lines.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (not a vulnerability); used directly and by croner; migration to jiff tracked in #540" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained (not a vulnerability); crew automation time zones; goes with the jiff migration, #540" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
